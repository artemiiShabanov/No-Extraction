# Единый источник плана No-Extraction.
# Из него генерируются docs/PLAN.md и метки/вехи/задачи на GitHub:
#   python3 tools/github/sync_plan.py            # обновить PLAN.md
#   python3 tools/github/sync_plan.py --github   # плюс создать метки, вехи и задачи через gh
#
# size: S = полдня, M = день, L = два дня, XL = три дня (рабочие дни одного человека + Claude)

labels:
  types:
    "type: code":     {color: "1d76db", desc: "Геймплей, системы, инструменты"}
    "type: 3d":       {color: "8e44ad", desc: "Модели, риги, анимации, сцены"}
    "type: design":   {color: "0e8a16", desc: "Контент, баланс, правила, волны, апгрейды"}
    "type: vfx":      {color: "f39c12", desc: "Частицы, шейдеры, свет, пост-обработка"}
    "type: ui":       {color: "e91e63", desc: "HUD, меню, экраны"}
    "type: audio":    {color: "1abc9c", desc: "Звук и музыка"}
    "type: art":      {color: "fbca04", desc: "2D-арт: иконки, капсула, текстуры"}
    "type: release":  {color: "5a5a5a", desc: "Steam, сборки, инфраструктура"}
  owners:
    "owner: artemii": {color: "c2e0c6", desc: "Делает Артемий"}
    "owner: claude":  {color: "bfd4f2", desc: "Делает Claude"}
    "owner: both":    {color: "e6d7f5", desc: "Совместно"}
  status:
    "status: needs decision": {color: "b60205", desc: "Нужно решение Артемия по дизайну"}
    "status: in progress": {color: "fef2c0", desc: "В работе"}
    "status: blocked":     {color: "d93f0b", desc: "Заблокировано"}
    "status: needs playtest": {color: "d4c5f9", desc: "Готово, ждёт проверки в игре"}

phases:
  - id: M0
    title: "M0 Прототип и проверка рисков"
    goal: "Закрыть технические риски до планирования."
    done_when: "Толпа, выстрел, рэгдолл, Mixamo, зоны попаданий, дуэли, окружение, сборка под Windows работают."
    status: done
    issues:
      - {title: "Прототип: стена, толпа, выстрел, рэгдолл", types: [code, 3d], owner: claude, size: L, done: true}
      - {title: "Пайплайн Mixamo для блочного рыцаря", types: [3d], owner: both, size: M, done: true}
      - {title: "Зоны попаданий и дуэли 1 на 1", types: [code], owner: claude, size: M, done: true}
      - {title: "Окружение из ассетов Poly Haven и сборка под Windows", types: [3d, release], owner: claude, size: M, done: true}

  - id: M1
    title: "M1 Вертикальный срез: один забег"
    goal: "Сыграть один полный забег от первой волны до портала и финала, пусть и с заглушками."
    done_when: "Волны, состояние замка, портал с выбором, поражение и победа работают; плейтест отвечает на вопрос, весело ли."
    issues:
      - title: "Система волн"
        types: [code]
        owner: claude
        size: L
        body: "Описание волны: состав, направления атаки, тайминги. Старт и конец волны, состояние между волнами. Данные волн в отдельном ресурсе, чтобы дизайнить без кода."
      - title: "Состояние замка: ворота и защитники как здоровье"
        types: [code, design]
        owner: claude
        size: M
        body: "Враги у ворот наносят урон воротам, у стены убивают защитников. Поражение, когда ворота пали. Здоровье должно читаться физически: трещины, огонь, пустеющая стена, а не только полоска."
      - title: "Приоритетные цели: капитан и расчёт тарана"
        types: [code, design]
        owner: claude
        size: L
        body: "Капитан усиливает соседей и заметен визуально. Расчёт тарана быстро ломает ворота. Игрок должен понимать, кого стрелять первым, без подсказок в UI."
      - title: "Враг-лучник и оглушение игрока"
        types: [code, vfx]
        owner: claude
        size: M
        body: "Лучники стреляют по герою на стене. Попадание оглушает: тряска, размытие, срыв прицела. Лучники становятся приоритетной целью."
      - title: "Боезапас на волну и пополнение у портала"
        types: [code, design]
        owner: claude
        size: S
        body: "Фиксированный боезапас на волну, промах стоит реально. Пополнение только у портала или апгрейдом."
      - title: "Портал: уйти с очками или взять один из трёх апгрейдов"
        types: [code, ui]
        owner: claude
        size: M
        body: "Отдельная дверь выхода и выбор апгрейда внутри. Каркас апгрейдов и первые 5 штук. Превью следующей волны у портала."
      - title: "Конец забега: победа, поражение, экран результатов"
        types: [code, ui]
        owner: claude
        size: M
        body: "Победа на финальной волне, поражение при падении ворот. Очки забега сгорают при поражении, сохраняются при выходе через портал."
      - title: "Перемещение по стене: лестницы на башни, границы"
        types: [code, 3d]
        owner: claude
        size: M
        body: "Игрок свободно ходит вдоль стены и заходит на башни. Невидимые стены там, где идти нельзя."
      - title: "HUD-заглушка: патроны, волна, ворота, лента убийств"
        types: [ui]
        owner: claude
        size: S
      - title: "Плейтест 1: весело ли? Скорость пули, размер волн, время убийства"
        types: [design]
        owner: artemii
        size: M
        body: "Сыграть 3-5 забегов, записать ощущения по пилларам: каждый выстрел это решение, превосходство, читаемость поля боя, честный выбор у портала."

  - id: M2
    title: "M2 Контент и разнообразие"
    goal: "Набить забег врагами, апгрейдами и волнами так, чтобы 2-3 часа не повторялись."
    done_when: "6 типов врагов, 12-15 апгрейдов, 10 волн с рандомизацией, союзники-лучники, поле боя одето."
    issues:
      - title: "Ростер врагов: щитоносец, копейщик, берсерк, капитан, лучник, расчёт тарана"
        types: [code, 3d]
        owner: claude
        size: XL
        body: "Поведение и параметры каждого типа. Щитоносец блокирует спереди, берсерк быстрый и без щита, копейщик держит дистанцию в дуэли."
      - title: "Визуальные варианты врагов: шлемы, плюмажи, знамёна, палитры"
        types: [3d, art]
        owner: both
        size: M
        body: "Один риг, разные наборы деталей через крепление к костям. Палитры фракций рисует Артемий."
      - title: "Таран: модель и расчёт, который его толкает"
        types: [3d, code]
        owner: claude
        size: M
      - title: "Союзники-лучники на стене"
        types: [code]
        owner: claude
        size: M
        body: "Стреляют по врагам в поле, гибнут от вражеских лучников. Дают ощущение живой обороны."
      - title: "Набор апгрейдов 12-15 штук"
        types: [design, code]
        owner: both
        size: L
        body: "Ремонт ворот, подкрепление, боезапас, скорость пули, пробитие щитов, иммунитет к оглушению, замедление времени на последнем патроне и т. п. Конфликтующие по ресурсам варианты у портала."
      - title: "Сценарии 10 волн и рандомизация состава и направлений"
        types: [design]
        owner: both
        size: M
      - title: "Погода и время суток: утро, закат, туман"
        types: [vfx, code]
        owner: claude
        size: M
        body: "Меняют читаемость и настроение волны. Туман сокращает дистанцию, закат даёт силуэты."
      - title: "Осадный лагерь в поле: палатки, знамёна, частокол"
        types: [3d]
        owner: claude
        size: M
      - title: "Двор за стеной: постройки и реквизит"
        types: [3d]
        owner: claude
        size: M
        body: "Чтобы за спиной игрока не было пустоты."
      - title: "Полный набор анимаций Mixamo под все типы"
        types: [3d]
        owner: both
        size: M
        body: "Ходьба, бег, удары, реакция на попадание, варианты смерти, натяжение лука, толкание тарана. Скачивает Артемий, встраивает Claude."

  - id: M3
    title: "M3 Мета и прогрессия"
    goal: "Забеги связаны между собой: очки, прокачка винтовки, сохранение, кривая на 4-6 забегов."
    done_when: "Игрок проходит игру за 2-3 часа с ощущением роста, финал сложный, но честный."
    issues:
      - title: "Экономика очков и математика экстракшена"
        types: [design, code]
        owner: both
        size: M
        body: "Сколько даёт волна, сколько сгорает при поражении, сколько стоят апгрейды винтовки. Таблица в отдельном файле."
      - title: "Прокачка винтовки между забегами: 5-6 веток"
        types: [code, design]
        owner: claude
        size: M
        body: "Магазин, скорость пули, кратность прицела, скорость затвора, пробитие."
      - title: "Сохранение профиля"
        types: [code]
        owner: claude
        size: S
        body: "JSON в user://, позже Steam Cloud."
      - title: "Главное меню, старт забега, экран прокачки"
        types: [ui]
        owner: claude
        size: M
        body: "Функциональные экраны без арта."
      - title: "Визуальные ступени винтовки"
        types: [3d]
        owner: claude
        size: S
      - title: "Балансировка кривой на 4-6 забегов"
        types: [design]
        owner: both
        size: L
        body: "Логи забегов, телеметрия попаданий и промахов, подгонка финальной волны."

  - id: M4
    title: "M4 Смачность и полировка"
    goal: "Каждый выстрел ощущается, поле боя живое, картинка держит стиль."
    done_when: "Звук, VFX, отклик попаданий, освещение и окружение доведены до уровня трейлера."
    issues:
      - title: "Звук: выстрел, затвор, попадания в плоть, щит, камень, бой вдалеке, музыка"
        types: [audio]
        owner: artemii
        size: XL
      - title: "Отклик попадания: хитмаркеры, индикатор хедшота, подтверждение убийства"
        types: [vfx, ui]
        owner: claude
        size: M
      - title: "VFX: вспышка, дым, искры от щита, пыль, стрелы, стилизованная кровь"
        types: [vfx]
        owner: claude
        size: M
      - title: "Рэгдоллы и трупы: засыпание, долгое хранение без просадок"
        types: [code]
        owner: claude
        size: M
      - title: "Прицел: шейдер линзы, покачивание, задержка дыхания, ступени зума"
        types: [code, vfx]
        owner: claude
        size: M
      - title: "Свет и пост-обработка: цветокоррекция, туман, настройка SDFGI"
        types: [vfx]
        owner: claude
        size: M
      - title: "Окружение: трава, деревья, тропы, модели камней"
        types: [3d]
        owner: claude
        size: M
      - title: "Анимации рук и винтовки: затвор, перезарядка"
        types: [3d]
        owner: claude
        size: M
      - title: "Арт UI: HUD, меню, шрифты, иконки в пиксельном стиле"
        types: [art, ui]
        owner: artemii
        size: L
      - title: "Визуал урона замку: щепки ворот, огонь, падающие знамёна"
        types: [vfx, 3d]
        owner: claude
        size: M

  - id: M5
    title: "M5 Релиз в Steam"
    goal: "Страница, сборки, настройки, достижения, плейтест и выход."
    done_when: "Игра куплена и запущена незнакомым человеком без нашего участия."
    issues:
      - title: "Аккаунт Steamworks, приложение, черновик страницы"
        types: [release]
        owner: artemii
        size: M
        body: "Запустить в первую неделю фазы: страница должна висеть минимум 2 недели до релиза."
      - title: "GodotSteam: инициализация, достижения, оверлей, облачные сохранения"
        types: [code, release]
        owner: claude
        size: M
      - title: "Настройки: графика, разрешение, чувствительность, переназначение клавиш, громкость"
        types: [ui, code]
        owner: claude
        size: M
      - title: "Локализация RU/EN"
        types: [design]
        owner: both
        size: S
      - title: "Капсула, скриншоты, трейлер"
        types: [art]
        owner: both
        size: L
        body: "Арт рисует Артемий, захват кадров и монтаж помогает Claude."
      - title: "Достижения: 12 штук"
        types: [design]
        owner: both
        size: S
      - title: "Производительность: минимальные требования, LOD рыцарей, профилирование на Windows"
        types: [code]
        owner: claude
        size: M
      - title: "Пайплайн сборок: скрипт Win/Mac, версии, загрузка депо в Steam"
        types: [release]
        owner: claude
        size: M
      - title: "Закрытый плейтест с друзьями и разбор багов"
        types: [design]
        owner: artemii
        size: L
      - title: "Чек-лист запуска и готовность к патчу первого дня"
        types: [release]
        owner: both
        size: S

  - id: M6
    title: "M6 Если останется время"
    goal: "Приятные вещи, которые не блокируют релиз."
    done_when: "По желанию."
    issues:
      - title: "3D-хаб вместо главного меню: тир с мишенями"
        types: [code, 3d]
        owner: claude
        size: L
      - title: "Лестницы и штурм стены"
        types: [code, 3d]
        owner: claude
        size: XL
      - title: "Вторая карта или зеркальная вариация замка"
        types: [3d, design]
        owner: both
        size: XL
